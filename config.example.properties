# Free My TV settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.

# Free key from https://www.themoviedb.org/settings/api (the "API Read Access Token" or the "API Key").
# Without it, the home screen still works, just without the trending picks.
tmdb_key=

# Optional: your TMDB profile, so Explore follows your taste (favorites, ratings, watchlist). It is secret like the key.
# Get it with: python3 tools/tmdb_login.py (it opens TMDB for you to approve, then prints the value to paste here).
tmdb_session=

# Sports on Explore: the next Serie A / Champions League match, Formula 1 or MotoGP session, or tennis final.
# Football needs a free key from https://www.football-data.org/client/register (it stays on your computer).
sports=true
football_key=
# Apps that show them, in order (the first installed opens). Add your Sky app's package: adb shell pm list packages | grep -i sky
# Pictures behind the Champions League and Europa League cards (a link each; empty = the ones that come with the app).
champions_art=
europa_art=
# Same for Serie A (empty = the picture that comes with the app).
seriea_art=
sports_apps=com.dazn,com.amazon.amazonvideo.livingroom

# Your country (two letters): decides which titles are on which streaming app. US, GB, CA, BR, DE, FR...
tmdb_region=IT

# Your city, for the weather and the sunset that turns the home screen dark at night (decimal degrees).
latitude=45.4467
longitude=9.3517
# Optional: the name shown on the weather card (empty = "Weather").
city=Caleppio di Settala

# Profile button (top right). Android doesn't hand apps the Google photo, so give a link to your own picture
# (a square image, https://...) and, if you like, the name to show. Empty = the initial of the TV's Google account.
profile_photo=
profile_name=

# auto (follows the TV), en, es, it or pt
language=it

# true shows cryptocurrency prices from Binance on the home screen and screensaver.
show_crypto=true

# Crypto prices: USD, BRL, EUR... (used only when show_crypto=true)
currency=EUR

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=C

# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working
disable_assistant=false
